name: CD

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_BACKEND_REPO: autoassist-backend
  ECR_FRONTEND_REPO: autoassist-frontend

jobs:
  # Independent gate, deliberately not shared with ci.yml's test job — this
  # workflow triggers in parallel with CI on every push to main, so a
  # failing test needs to block *this* workflow's own deploy job directly,
  # not rely on CI's separate run succeeding first.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: backend
        run: pytest test_engine.py test_stats.py -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::224603709350:role/autoassist-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        run: |
          docker build -t ${{ steps.ecr-login.outputs.registry }}/$ECR_BACKEND_REPO:latest ./backend
          docker push ${{ steps.ecr-login.outputs.registry }}/$ECR_BACKEND_REPO:latest

      - name: Build and push frontend image
        run: |
          docker build -t ${{ steps.ecr-login.outputs.registry }}/$ECR_FRONTEND_REPO:latest ./frontend
          docker push ${{ steps.ecr-login.outputs.registry }}/$ECR_FRONTEND_REPO:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC, no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::224603709350:role/autoassist-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Find running instance
        id: find-instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=autoassist-app" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSM
        if: steps.find-instance.outputs.instance_id != 'None' && steps.find-instance.outputs.instance_id != ''
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.find-instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "cd /opt/autoassist",
              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 224603709350.dkr.ecr.us-east-1.amazonaws.com",
              "docker compose -f docker-compose.prod.yml pull",
              "docker compose -f docker-compose.prod.yml up -d"
            ]' \
            --query 'Command.CommandId' --output text)

          echo "Waiting for deploy command $COMMAND_ID to finish..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.find-instance.outputs.instance_id }}" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.find-instance.outputs.instance_id }}" \
            --query 'Status' --output text)

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.find-instance.outputs.instance_id }}" \
            --query 'StandardOutputContent' --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy command finished with status: $STATUS"
            exit 1
          fi

      - name: No running instance - skip deploy
        if: steps.find-instance.outputs.instance_id == 'None' || steps.find-instance.outputs.instance_id == ''
        run: |
          echo "No EC2 instance currently running (infra is torn down per the"
          echo "destroy-between-sessions pattern). Image pushed to ECR; it will"
          echo "be pulled automatically the next time 'terraform apply' brings"
          echo "the instance back up."
