name: CI

on:
  push:
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: backend
        # test_engine.py/test_stats.py test pure functions that never touch a
        # real database, but they transitively import database.py (via
        # models.py, just for the ORM class definitions), which calls
        # create_engine(DATABASE_URL) at import time - with no real .env in
        # CI (correctly, it's git-ignored), DATABASE_URL is unset and engine
        # construction fails before any test runs. A syntactically-valid
        # dummy URL satisfies create_engine() without ever being connected to.
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/unused
        run: pytest test_engine.py test_stats.py -v

  lint-and-build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t autoassist-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t autoassist-frontend:ci ./frontend
